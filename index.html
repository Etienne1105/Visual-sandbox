<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Sandbox</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .sandbox { text-align: center; }
        .sandbox h1 { font-size: 2rem; font-weight: 300; letter-spacing: 0.05em; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="sandbox">
        <h1>Visual Sandbox</h1>
    </div>
</body>
</html>
